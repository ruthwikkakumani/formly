services:
  - type: web
    name: formly-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: formly-data
      mountPath: /data
      sizeGB: 1
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port 8000

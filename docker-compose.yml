services:
  backend:
    image: ruthwikkakumani/formly-backend:latest
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - formly-data:/data
    environment:
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000

  frontend:
    image: ruthwikkakumani/formly-frontend:latest
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  formly-data:
